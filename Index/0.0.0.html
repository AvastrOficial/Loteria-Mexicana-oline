<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <a href="https://www.foroactivo.com" target="_blank"></a>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Loteria Mexicana By AvaStrOficial</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #b3e5ff;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.5s;
      overflow-x: hidden;        /* evita desplazamiento horizontal */
      width: 100%;
      position: relative;
    }

    /* ===== FONDO DE GRANJA (VERSIÓN PC Y MÓVIL) ===== */
    .farm-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 0;
      pointer-events: none;
    }

    /* Por defecto (pantallas grandes) usamos la imagen solicitada para PC */
    .farm-bg {
      background-image: url('https://image.slidesdocs.com/responsive-images/background/farm-ranch-illustration-powerpoint-background_f2b879cc46__960_540.jpg');
    }

    /* Para móviles (pantallas <= 600px) mantenemos la imagen anterior que ya funcionaba bien */
    @media (max-width: 600px) {
      .farm-bg {
        background-image: url('https://static.vecteezy.com/system/resources/thumbnails/028/509/712/small_2x/a-cartoon-style-illustration-of-a-farm-with-a-red-barn-and-a-dirt-road-generative-ai-photo.jpg');
      }
    }

    /* overlay cielo/blanco con opacidad (se aplica sobre granja) */
    .overlay-style {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(145deg, #b3e5ff 0%, #ffffff 80%);
      opacity: 0.75;  /* opacidad ligeramente reducida para que se integre mejor */
      transition: opacity 1s ease;
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .overlay-fadeout {
      opacity: 0 !important;
    }

    /* capa principal de etapas */
    .content {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      color: #1a3e4c;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
    }

    .etapa {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .hidden {
      display: none !important;
    }

    /* ---------- ETAPA 1: LOTERÍA MEXICANA ---------- */
    .txt-loteria {
      font-size: clamp(3rem, 15vw, 7rem);
      font-weight: 900;
      letter-spacing: 6px;
      color: #0a2f44;
      backdrop-filter: blur(4px);
      padding: 0.3em 1.2em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      animation: aparecer 1s ease-out;
    }

    @keyframes aparecer {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---------- ETAPA 2: GALLO (deslizamiento desde abajo) ---------- */
    .gallo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      animation: deslizarArriba 1.2s ease-out forwards;
    }

    @keyframes deslizarArriba {
      0% { opacity: 0; transform: translateY(120px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .gallo-img {
      max-width: 90vw;
      width: 400px;
      height: auto;   
      padding: 8px;
      backdrop-filter: blur(6px);
    }

    /* ---------- ETAPA 3: BARRA DE CARGA (SIN BORDES NI CAJA) ---------- */
    .loading-barra-simple {
      width: 100%;
      max-width: 500px;
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .loading-text {
      font-size: 2rem;
      font-weight: 500;
      color: #023b4b;
      text-shadow: 2px 2px 6px white;
      letter-spacing: 1px;
    }

    .progress-bar-track {
      width: 100%;
      height: 20px;
      background: transparent;
      border: none;
      outline: none;
      box-shadow: none;
      position: relative;
      margin: 5px 0;
    }

    .progress-bar-fill {
      width: 0%;
      height: 20px;
      background: linear-gradient(90deg, #66c2ff, #ffffff, #b3f0ff);
      border-radius: 30px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      transition: width 0.3s linear;
      border: none;
      outline: none;
    }

    .progress-percent {
      font-size: 2.2rem;
      font-weight: 700;
      color: #003546;
      text-shadow: 0 0 8px white;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .redirect-message {
      font-size: 1.5rem;
      color: #023047;
      font-weight: 600;
      margin-top: 20px;
      background: rgba(255,255,240,0.5);
      backdrop-filter: blur(3px);
      padding: 0.4rem 2rem;
      border-radius: 40px;
      border: 2px solid white;
    }

    /* móvil: ajustes específicos */
    @media (max-width: 600px) {
      body {
        overflow-x: hidden;
      }
      .gallo-img {
        width: 85vw;
      }
      .loading-text {
        font-size: 1.8rem;
      }
      .progress-percent {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body id="mainBody">

  <!-- fondo de granja (cambia según dispositivo) -->
  <div class="farm-bg" id="farmBackground"></div>
  <div class="overlay-style" id="colorOverlay"></div>
  <div class="content" id="contentStage">

    <!-- ETAPA 1: LOTERÍA MEXICANA -->
    <div id="etapaLoteria" class="etapa">
      <div class="txt-loteria">LOTERÍA MEXICANA</div>
      <div style="font-size: 1.4rem; background: rgba(255,255,240,0.5); padding: 0.5rem 2rem; border-radius: 40px;">
        El juego más tradicional
      </div>
    </div>

    <!-- ETAPA 2: GALLO (desliza hacia el centro) -->
    <div id="etapaGallo" class="etapa hidden">
      <div class="gallo-container">
        <img class="gallo-img" src="https://files.catbox.moe/8tvw03.png" alt="Gallo loteria">     
      </div>
    </div>

    <!-- ETAPA 3: BARRA DE CARGA (SIN BORDES NI CAJA) -->
    <div id="etapaLoading" class="etapa hidden">
      <div class="loading-barra-simple">
        <div class="loading-text">cargando...</div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-percent" id="progressPercent">0%</div>
      </div>
      <div class="redirect-message" id="redirectMsg" style="display: none;">¡Redirigiendo!</div>
    </div>

  </div>

  <script>
    (function() {
      const farmBg = document.getElementById('farmBackground');
      const overlay = document.getElementById('colorOverlay');
      const etapaLoteria = document.getElementById('etapaLoteria');
      const etapaGallo = document.getElementById('etapaGallo');
      const etapaLoading = document.getElementById('etapaLoading');
      const progressFill = document.getElementById('progressFill');
      const progressPercent = document.getElementById('progressPercent');
      const redirectMsg = document.getElementById('redirectMsg');

      // ---- Duración total de la barra: 20 segundos ----
      const DURACION_BARRA = 20;

      // 1. inicio: fondo invisible, overlay visible, solo lotería
      farmBg.style.opacity = '0';
      overlay.classList.remove('overlay-fadeout');

      // 2. a los 2 segundos: desaparece lotería, aparece gallo (deslizando hacia arriba)
      setTimeout(() => {
        etapaLoteria.classList.add('hidden');
        etapaGallo.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 2000);

      // 3. a los 4 segundos: fondo de granja aparece, overlay se desvanece (quitado colores cielo)
      setTimeout(() => {
        farmBg.style.opacity = '1';
        overlay.classList.add('overlay-fadeout');
      }, 4000);

      // 4. a los 6 segundos: gallo se oculta, aparece barra de carga (20s)
      setTimeout(() => {
        etapaGallo.classList.add('hidden');
        etapaLoading.classList.remove('hidden');

        let progreso = 0;
        const incremento = 900 / DURACION_BARRA; // 5% por segundo

        if (window._intervaloBarra) clearInterval(window._intervaloBarra);
        progreso = 0;
        actualizarBarra(progreso);

        window._intervaloBarra = setInterval(() => {
          progreso += incremento;
          if (progreso >= 100) {
            progreso = 100;
            actualizarBarra(progreso);
            clearInterval(window._intervaloBarra);
            window._intervaloBarra = null;
            redirectMsg.style.display = 'block';
            setTimeout(() => {
              window.location.href = 'https://loteriamexicanaapp.forum2x2.ru/h4-id-roi'; // cambiar URL si se desea
            }, 800);
          } else {
            actualizarBarra(progreso);
          }
        }, 1000);
      }, 6000);

      function actualizarBarra(porcentaje) {
        const redondeado = Math.min(100, Math.max(0, porcentaje));
        progressFill.style.width = redondeado + '%';
        progressPercent.textContent = Math.floor(redondeado) + '%';
      }
    })();
  </script>

</body>
</html>
